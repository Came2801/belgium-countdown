<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race to Belgium | F1 Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-overlay"></div>

    <div class="container">
        <h1>Destination: Spa</h1>
        <div class="subtitle">Lights out in...</div>

        <div class="countdown-grid">
            <div class="time-box">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <div class="number" id="hours">00</div>
                <div class="label">Hrs</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Mins</div>
            </div>
            <div class="time-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Secs</div>
            </div>
        </div>

        <div class="flight-info">
            <div class="flight-route">
                <span class="route-path">SJU &rarr; ATL &rarr; AMS &rarr; BRU</span>
                <span class="flight-meta">Delta 1763 · Economy Light</span>
            </div>
            <div class="flight-time">
                <span class="departure-date">JULY 15</span>
                <span class="departure-hour">07:30 AM Departure</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
